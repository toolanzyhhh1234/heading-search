name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Check tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'const m=require("./manifest.json");if(m.version!==process.env.TAG)process.exit(1)'
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/release/main.js dist/release/manifest.json dist/release/styles.css dist/release/SHA256SUMS dist/heading-search-*.zip --draft --generate-notes
